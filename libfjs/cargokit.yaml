precompiled_binaries:
  url_prefix: https://github.com/ClosedHarmony/fjs/releases/download/precompiled_
  public_key: c5766595e58b3b0ed70c041f0cd11df8b34e08e12a8ecd03c4f94c6edf16f472
  workspace_root: ..
  hash_inputs:
    - cargokit/build_tool/lib
    - cargokit/build_tool/pubspec.yaml
    - cargokit/build_tool/pubspec.lock
    - cargokit/run_build_tool.sh
    - libfjs/Cargo.toml
    - libfjs/Cargo.lock
    - libfjs/cargokit.yaml
    - libfjs/src
    - libfjs/src/frb_generated.rs
    - pubspec.yaml
    - darwin/fjs/Package.swift
    - lib/src/frb/frb_generated.dart
    - lib/src/frb/frb_generated.io.dart
    - lib/src/frb/frb_generated.web.dart
    - tool/assemble_fjs_xcframework.sh
    - tool/build_fjs_xcframework.sh
    - tool/check_darwin_package_support.sh
    - tool/check_frb_codegen.sh
    - tool/check_frb_content_hash.dart
  build_recipe:
    rust_toolchain: '1.97.1'
    flutter_version: '3.35.3'
    xcode_version: '16.4'
    sdk_versions:
      iphoneos: '18.5'
      macosx: '15.5'
      android_ndk: '28.2.13676358'
    deployment_targets:
      ios: '12.0'
      macos: '10.14'
      android: '21'
    rust_targets:
      - aarch64-apple-ios
      - aarch64-apple-ios-sim
      - x86_64-apple-ios
      - aarch64-apple-darwin
      - x86_64-apple-darwin
      - aarch64-linux-android
      - armv7-linux-androideabi
      - x86_64-linux-android
      - x86_64-pc-windows-msvc
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
  composite_groups:
    - name: swiftpm
      host: macos
      required_targets:
        - aarch64-apple-ios
        - aarch64-apple-ios-sim
        - x86_64-apple-ios
        - aarch64-apple-darwin
        - x86_64-apple-darwin
      argv:
        - tool/assemble_fjs_xcframework.sh
      environment:
        COPYFILE_DISABLE: '1'
        LC_ALL: C
        PATH: /usr/bin:/bin:/usr/sbin:/sbin
        TZ: UTC
      timeout_seconds: 1800
      outputs:
        - fjs.xcframework.zip
        - fjs.xcframework.zip.checksum
